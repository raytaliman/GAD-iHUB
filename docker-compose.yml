services:
  api:
    image: postgrest/postgrest
    container_name: ihub-api
    restart: always
    environment:
      PGRST_DB_URI: postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      PGRST_DB_SCHEMA: ${PGRST_DB_SCHEMA:-public}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-postgres}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-super-secret-jwt-key-for-local-development-12345}
      PGRST_LOG_LEVEL: ${PGRST_LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3001}:3000"

  email:
    image: node:20-alpine
    container_name: ihub-email
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install --production && node server.js"
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-http://localhost:3001}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: ihub-app
    restart: always
    ports:
      - "${APP_PORT:-3002}:80"
    depends_on:
      - api
      - email

# No global volumes needed for bind mounts

